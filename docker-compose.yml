version: "3.8"

services:

  backend:
    build: ./Backend
    container_name: backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build: ./Front-end
    container_name: frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
